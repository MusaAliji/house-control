name: Android
on:
  push:
    paths: ['android/**', 'web/**', 'scripts/build-android.ps1', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'web/**', 'scripts/build-android.ps1', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build Android APK and run lint
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HouseControl-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
